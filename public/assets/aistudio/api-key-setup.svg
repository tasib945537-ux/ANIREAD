<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ANIREAD Gemini API key setup</title>
  <desc id="desc">Three steps: open Google AI Studio, create and copy an API key, then paste and save it in ANIREAD.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <text x="64" y="78" fill="#c7d2fe" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">ANIREAD • QUICK SETUP</text>
  <text x="64" y="132" fill="#ffffff" font-family="Arial,sans-serif" font-size="42" font-weight="800">Connect your Gemini API key</text>
  <g transform="translate(64 190)">
    <rect width="330" height="340" rx="24" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <circle cx="54" cy="58" r="30" fill="#312e81"/><text x="54" y="68" text-anchor="middle" fill="#e0e7ff" font-family="Arial,sans-serif" font-size="30" font-weight="700">1</text>
    <rect x="36" y="116" width="258" height="90" rx="16" fill="#1e293b"/>
    <path d="M70 161h190" stroke="#818cf8" stroke-width="9" stroke-linecap="round"/>
    <path d="M70 185h120" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
    <text x="36" y="256" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Open AI Studio</text>
    <text x="36" y="292" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Sign in to your Google</text>
    <text x="36" y="318" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">account.</text>
  </g>
  <path d="M416 360h42m-14-14 14 14-14 14" fill="none" stroke="#a5b4fc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(470 190)">
    <rect width="330" height="340" rx="24" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <circle cx="54" cy="58" r="30" fill="#581c87"/><text x="54" y="68" text-anchor="middle" fill="#f3e8ff" font-family="Arial,sans-serif" font-size="30" font-weight="700">2</text>
    <rect x="36" y="116" width="258" height="90" rx="16" fill="#1e293b"/>
    <rect x="66" y="142" width="194" height="38" rx="9" fill="#312e81" stroke="#818cf8"/>
    <path d="M88 161h108" stroke="#e0e7ff" stroke-width="6" stroke-linecap="round"/>
    <text x="36" y="256" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Create API key</text>
    <text x="36" y="292" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Create a key and copy it</text>
    <text x="36" y="318" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">privately. Never share it.</text>
  </g>
  <path d="M822 360h42m-14-14 14 14-14 14" fill="none" stroke="#a5b4fc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(876 190)">
    <rect width="260" height="340" rx="24" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <circle cx="54" cy="58" r="30" fill="#064e3b"/><text x="54" y="68" text-anchor="middle" fill="#d1fae5" font-family="Arial,sans-serif" font-size="30" font-weight="700">3</text>
    <rect x="30" y="116" width="200" height="90" rx="16" fill="#1e293b"/>
    <rect x="50" y="140" width="160" height="18" rx="8" fill="#475569"/>
    <rect x="50" y="169" width="110" height="22" rx="8" fill="url(#accent)"/>
    <text x="30" y="256" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Save in ANIREAD</text>
    <text x="30" y="292" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Paste the key in the</text>
    <text x="30" y="318" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">API Key settings page.</text>
  </g>
  <text x="64" y="578" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">Your key stays on this device and is sent only with your translation requests.</text>
</svg>